# Osvežava data/gledajcrtace.json (indeks epizoda koji plugin čita sa GitHub Pages-a).
name: gledajcrtace index

on:
  schedule:
    - cron: '17 4 * * 1'   # ponedeljkom 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build-gledajcrtace.cjs
      - name: Commit if changed
        run: |
          # "built" se menja svaki put — commit samo kad se promene epizode/filmovi
          if git diff --quiet -I '"built"' -- data/gledajcrtace.json; then
            echo "bez promena"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gledajcrtace.json
          git commit -m "gledajcrtace index: osvežen"
          git push
